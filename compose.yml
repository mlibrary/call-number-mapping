---
services:
  web:
    build:
      context: .
    environment:
    - LDAP_UPDATE_USER=${USER}
    env_file:
    - .env
    volumes:
    - .:/var/www
    ports:
    - "3000:80"
    depends_on:
    - db

  db:
    image: mariadb:13.0
    env_file:
    - .env
    volumes:
    - "db:/var/lib/mysql"
    - "./db/init-data-tables.sql:/docker-entrypoint-initdb.d/init-data.sql"

  apache-exporter:
    image: bitnami/apache-exporter:latest@sha256:74e695f827434fd6a99ca62ea08f828461abe51015cb3406691cc187b4cb2664
    command: [ "--scrape_uri=http://web:81/server-status?auto" ]
    profiles:
      - monitoring

volumes:
  db:
