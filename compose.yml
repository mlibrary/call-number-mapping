---
services:
  web:
    build:
      context: .
    environment:
    - LDAP_UPDATE_USER=${USER}
    env_file:
    - .env
    volumes:
    - .:/var/www
    ports:
    - "3000:80"
    depends_on:
    - db

  db:
    image: mariadb:13.0
    env_file:
    - .env
    volumes:
    - "db:/var/lib/mysql"
    - "./db/init-data-tables.sql:/docker-entrypoint-initdb.d/init-data.sql"

  apache-exporter:
    image: bitnami/apache-exporter:latest@sha256:250bd3f8a98e3438100c796ec69f36e1b7f1b4d0f74fe2aa113f44aa6b588bf4
    command: [ "--scrape_uri=http://web:81/server-status?auto" ]
    profiles:
      - monitoring

volumes:
  db:
